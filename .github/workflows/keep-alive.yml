name: Keep Render Alive

on:
  schedule:
    # GitHub Actions の cron は UTC 指定（日本時間 JST = UTC+9）
    # 1) 毎日 JST 19:00〜翌03:59（UTC 10:00〜18:59）
    - cron: '*/10 10-18 * * *'
    # 2) JST 土曜 04:00〜08:59（UTC 金曜 19:00〜23:59）
    - cron: '*/10 19-23 * * 5'
    # 3) JST 土曜 09:00〜日曜 08:59（UTC 土曜 終日）
    - cron: '*/10 * * * 6'
    # 4) JST 日曜 09:00〜18:59（UTC 日曜 00:00〜09:59）
    - cron: '*/10 0-9 * * 0'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Render service (with cold-start & 503 retry)
        run: |
          URL="https://line-discord-status.onrender.com/"
          for i in 1 2 3; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "Ping did not return 200 after 3 attempts, skipping without failing workflow"
          exit 0
